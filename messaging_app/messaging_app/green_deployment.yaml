apiVersion: apps/v1
kind: Deployment
metadata:
  name: messaging_app-green
  labels:
    app: messaging_app
    version: green
spec:
  replicas: 1
  selector:
    matchLabels:
      app: messaging_app
      version: green
  template:
    metadata:
      labels:
        app: messaging_app
        version: green
    spec:
      containers:
      - name: messaging-app
        image: app:green  # Use your new green image tag
        ports:
        - containerPort: 8000
        imagePullPolicy: Always
        readinessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5