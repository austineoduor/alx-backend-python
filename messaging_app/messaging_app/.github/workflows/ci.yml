name: Django CI

on:
  push:
    branches: [ "main" ]  # Or your main branch, e.g., "master"
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.9  # Or your Python version
      uses: actions/setup-python@v4
      with:
        python-version: 3.9

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up MySQL Database
      run: |
        sudo apt-get update
        sudo apt-get install -y mysql-client

    - name: Start MySQL
      run: |
        sudo systemctl start mysql
        # Check if MySQL is running
        sudo systemctl status mysql

    - name: Setup Database for Testing
      run: |
        mysql -u root -e "CREATE DATABASE IF NOT EXISTS test_db;"
        mysql -u root -e "GRANT ALL PRIVILEGES ON test_db.* TO 'django'@'localhost' IDENTIFIED BY 'password';"
        mysql -u root -e "FLUSH PRIVILEGES;"

    - name: Configure Django Settings for Testing
      run: |
        echo "DATABASES = {
            'default': {
                'ENGINE': 'django.db.backends.mysql',
                'NAME': 'test_db',
                'USER': 'django',
                'PASSWORD': 'password',
                'HOST': 'localhost',
                'PORT': '3306',
            }
        }" > settings_test.py
        echo "from .settings import * \nfrom .settings_test import *" >> myproject/settings.py #Replace myproject with your project name

    - name: Run Tests
      run: |
        python manage.py test --settings=myproject.settings #Replace myproject with your project name