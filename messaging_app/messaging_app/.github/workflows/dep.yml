name: Build and Push Docker Image

on:
  push:
    branches:
      - main  # or your main branch
  pull_request:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}  # Or use password if you don't have a token

      - name: Build and Push Docker Image
        id: docker-build
        uses: docker/build-push-action@v5
        with:
          context: .  # Current directory as build context
          file: ./Dockerfile  # Path to your Dockerfile
          push: true  # Push the image to the registry
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-messaging-app:latest # Replace with your Docker Hub repo name
          build-args: |
            VERSION=1.0.0 #Optional, example of build argument