version: "3.9"  # Use a compatible Compose file version
services:
  web:
    build: .  # Assumes Dockerfile is in the root of the project
    command: python3 manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DJANGO_SETTINGS_MODULE: messaging_app.settings
      MYSQL_HOST: db # Service name resolves to the DB container's IP
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DB: ${MYSQL_DB}

  db:
    image: mysql:8.0 # Or your preferred MySQL version
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DB: ${MYSQL_DB}
    ports:
      - "3306:3306"  # Only for local development and debugging (REMOVE in production!)
    volumes:
      - db_data:/var/lib/mysql #persist data in volume

volumes:
  db_data: